[project]
name = "tiny-os"
version = "0.2.0"
description = "Graph-native edge inference runtime: static graph -> verified zero-malloc C image"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
